# Rebuilds the generated parts of the pages whenever a file in data/ changes
# (for example, after a Pages CMS save).
# If the data has an error, the run fails and the live pages stay as they were.
name: Build site from data

on:
  push:
    branches: [main]
    paths:
      - "data/*.json"
      - scripts/build_site.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild pages from data/
        run: python3 scripts/build_site.py

      - name: Commit the rebuilt pages
        run: |
          if git diff --quiet -- '*.html'; then
            echo "Pages already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "Rebuild pages from data/"
          git push
